<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标注门户 · 平台能力演示</title>
<style>
:root{--blue:#2878e8;--ink:#152033;--muted:#65748d;--line:#dce5f0;--soft:#f4f7fb;--side:238px;font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink)}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;position:sticky;top:0;z-index:5}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#3b82f6,#7c6cf2);color:#fff;display:grid;place-items:center;font-weight:900}.brand{font-size:20px;font-weight:800;margin-left:12px}.tabs{display:flex;gap:24px;margin-left:auto}.tab{border:0;background:none;padding:23px 2px;color:var(--muted);cursor:pointer;font-weight:700}.tab.on{color:var(--blue);border-bottom:3px solid var(--blue)}.layout{display:grid;grid-template-columns:var(--side) 1fr;max-width:1440px;margin:auto;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px}.aside-title{font-size:12px;color:#94a3b8;font-weight:800;letter-spacing:.1em;padding:8px 12px}.nav{width:100%;border:0;background:transparent;border-radius:10px;text-align:left;padding:11px 12px;margin:2px 0;color:#52627b;cursor:pointer}.nav.on,.nav:hover{background:#eaf3ff;color:var(--blue);font-weight:750}.content{padding:28px 34px 80px;min-width:0}.crumb{font-size:14px;color:#8290a6;margin-bottom:18px}.hero,.section,.workbench{background:#fff;border:1px solid var(--line);border-radius:18px}.hero{padding:30px;background:linear-gradient(120deg,#eef5ff,#fff)}.eyebrow{color:var(--blue);font-weight:800}.hero h1{font-size:42px;margin:9px 0}.hero p,.desc{color:var(--muted);line-height:1.75}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.metric{background:rgba(255,255,255,.8);border:1px solid #dbeafe;border-radius:13px;padding:15px}.metric b{display:block;font-size:24px}.section{padding:25px;margin-top:20px}.section h2{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:17px}.card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:17px;text-align:left;cursor:pointer}.card:hover,.card.on{border-color:#66a7ff;background:#f0f7ff}.card h3{margin:0 0 7px}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:12px;font-weight:750}.flow{display:flex;gap:10px;overflow:auto;margin-top:18px}.step{flex:1;min-width:165px;border-radius:13px;background:#f0f6ff;padding:17px}.step b{display:block;margin:6px 0}.num{color:var(--blue);font-size:12px}.workbench{overflow:hidden;margin-top:20px}.wb-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff}.wb-head h2{margin:0}.wb-body{display:grid;grid-template-columns:190px 1fr;min-height:520px}.wb-menu{border-right:1px solid var(--line);padding:14px;background:#fbfdff}.wb-main{padding:22px;min-width:0}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}.control{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px}.primary{background:var(--blue);color:#fff;border-color:var(--blue);cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.stat small{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:4px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:#65748d;background:#f8fafc}.action{border:0;background:#eaf3ff;color:var(--blue);padding:6px 9px;border-radius:7px;cursor:pointer}.notice{margin-top:14px;padding:12px;border-radius:10px;background:#eff6ff;color:#345b8c}.empty{height:260px;display:grid;place-items:center;color:#8290a6}.hidden{display:none!important}
@media(max-width:800px){:root{--side:0}.top{padding:0 14px}.brand{font-size:17px}.tabs{gap:10px}.tab{font-size:13px}.layout{display:block}aside{display:none}.content{padding:18px 14px 60px}.hero h1{font-size:32px}.metrics,.stats{grid-template-columns:repeat(2,1fr)}.wb-body{grid-template-columns:1fr}.wb-menu{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{white-space:nowrap;width:auto}.flow{flex-direction:column}.step{min-width:0}}
</style></head><body><header class="top"><div class="logo">A</div><div class="brand">标注门户</div><nav class="tabs"><button class="tab on" data-platform="tonghang">通航 作业台</button><button class="tab" data-platform="ceyun">策云 作业管理台</button><button class="tab" data-platform="luopan">罗盘 项目管理台</button></nav></header><div class="layout"><aside><div class="aside-title">功能介绍</div><button class="nav on" data-view="overview">平台概览</button><button class="nav" data-view="roles">角色入口</button><button class="nav" data-view="map">能力地图</button><button class="nav" data-view="flow">主业务链路</button><div class="aside-title" style="margin-top:16px">交互演示</div><div id="sideModules"></div></aside><main class="content"><div class="crumb" id="crumb">功能介绍 / 通航</div><div id="page"></div></main></div>
<script>
const platforms={
tonghang:{name:'通航',type:'作业台',intro:'承接各业务队列的标注作业，围绕任务模板、双人标注、质检、验收与申诉，把作业执行和质量收敛放在同一条链路里。',metrics:[['13','能力模块'],['4','核心角色'],['5','质量环节']],roles:[['标注员','领取、标注、待定、释放并提交任务，参与双人标注与仲裁。'],['质检员','检查标注结果，记录错误级别与原因并推动修正。'],['验收员','抽查质检完成数据，记录问题并确认交付。'],['运营人员','维护队列、模板、培训任务和质量规则。']],groups:{'作业与质量':['标注','双人标注','质检','验收','申诉'],'查询与分析':['标注查询','标注统计','员工统计','工作看板'],'培训与管理':['模拟实操','无感标注','队列配置','任务模板']},flow:[['送审入队','业务方按公开示例协议送入数据。'],['进审待标注','任务进入目录对应的待标注池。'],['派发 / 领取','系统派发或标注员主动领取任务。'],['标注与复核','完成标注，按规则进入双人复核。'],['质检与验收','质量检查、问题修正并完成验收。'],['结果回传','形成结果并回传示例业务方。']]},
ceyun:{name:'策云',type:'作业管理台',intro:'围绕作业规划、批次生产、能力配置和交付管理，呈现内容服务的协同与管理视角。',metrics:[['3','管理阶段'],['3','协作角色'],['6','示例能力']],roles:[['业务方','维护需求、队列信息与知识准备。'],['交付负责人','安排批次、资源与作业交付。'],['平台管理员','维护能力、成员与平台配置。']],groups:{'作业规划':['任务规划','批次管理'],'生产交付':['作业交付','进度看板'],'能力管理':['能力选择','成员管理']},flow:[['需求进入','登记公开示例需求。'],['任务规划','定义环节和依赖。'],['批次生产','组织人员和任务。'],['质量收敛','跟踪质量与返工。'],['交付同步','提交结果并同步状态。']]},
luopan:{name:'罗盘',type:'项目管理台',intro:'将分散项目从建档、进度到预算与交付日报收拢到统一看板，支持考培、项目协同和运营支撑。',metrics:[['9','管理模块'],['4','使用角色'],['3','管理视角']],roles:[['项目负责人','关注计划、进度、风险与资源。'],['培训负责人','组织课程、练习与考核。'],['交付负责人','跟踪批次、日报和交付节点。'],['运营人员','维护需求、通知和日常记录。']],groups:{'项目全景':['业务全景','项目信息','项目批次'],'需求与交付':['需求清单','交付看板','交付日报'],'运营管理':['预算管理','培训考核','访问统计']},flow:[['项目建档','建立公开示例项目。'],['需求与排期','登记需求并确认节点。'],['人员考培','完成课程、练习与考核。'],['批次执行','跟踪生产进度和风险。'],['交付复盘','汇总日报、预算与结论。']]}};
let platform='tonghang',view='overview',moduleName='标注';const rows=[['DEMO-001','示例任务 A','待处理','张同学'],['DEMO-002','示例任务 B','进行中','李同学'],['DEMO-003','示例任务 C','已完成','王同学'],['DEMO-004','示例任务 D','待复核','赵同学']];
function modules(p){return Object.values(platforms[p].groups).flat()}function renderSide(){sideModules.innerHTML=modules(platform).map(x=>`<button class="nav ${view==='module'&&moduleName===x?'on':''}" data-module="${x}">${x}</button>`).join('');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{moduleName=b.dataset.module;view='module';render()})}
function overview(d){return `<section class="hero"><span class="eyebrow">${d.name} · ${d.type}</span><h1>${d.name}是什么</h1><p>${d.intro}</p><div class="metrics">${d.metrics.map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></section><section class="section"><h2>谁在用</h2><p class="desc">围绕 ${d.name} 的日常工作，不同角色各有一组常用入口。</p><div class="grid">${d.roles.map(r=>`<article class="card"><h3>${r[0]}</h3><p>${r[1]}</p></article>`).join('')}</div></section><section class="section"><h2>能力地图</h2><p class="desc">点击能力进入可操作的公开演示工作台。</p>${Object.entries(d.groups).map(([g,a])=>`<div><h3>${g}</h3><div class="grid">${a.map(x=>`<button class="card" data-open="${x}"><span class="pill">${d.name}</span><h3>${x}</h3><p>查看功能入口、任务列表、状态变化和操作反馈。</p></button>`).join('')}</div></div>`).join('')}</section><section class="section"><h2>主作业链路</h2><div class="flow">${d.flow.map((x,i)=>`<div class="step"><span class="num">${String(i+1).padStart(2,'0')}</span><b>${x[0]}</b><span class="desc">${x[1]}</span></div>`).join('')}</div></section>`}
function workbench(d){return `<section class="workbench"><div class="wb-head"><span class="pill">${d.name}</span><h2>${moduleName}</h2><span class="desc">公开交互演示</span></div><div class="wb-body"><nav class="wb-menu">${modules(platform).map(x=>`<button class="nav ${x===moduleName?'on':''}" data-wb="${x}">${x}</button>`).join('')}</nav><div class="wb-main"><div class="toolbar"><input class="control" placeholder="任务编号 / 关键词"><select class="control"><option>全部状态</option><option>待处理</option><option>进行中</option><option>已完成</option></select><button class="control primary" id="search">查询</button><button class="control" id="create">新建示例</button></div><div class="stats"><div class="stat"><small>任务总量</small><strong>128</strong></div><div class="stat"><small>今日完成</small><strong>36</strong></div><div class="stat"><small>待处理</small><strong>17</strong></div><div class="stat"><small>通过率</small><strong>96.4%</strong></div></div><div style="overflow:auto"><table><thead><tr><th>编号</th><th>任务名称</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead><tbody id="tbody">${rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${moduleName} · ${r[1]}</td><td id="s${i}">${r[2]}</td><td>${r[3]}</td><td><button class="action" data-do="${i}">处理</button></td></tr>`).join('')}</tbody></table></div><div class="notice" id="notice">所有任务、人员和数据均为虚构示例。点击“处理”体验状态变化。</div></div></div></section>`}
function render(){const d=platforms[platform];crumb.textContent=`功能介绍 / ${d.name}`;document.querySelectorAll('[data-platform]').forEach(b=>b.classList.toggle('on',b.dataset.platform===platform));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));renderSide();page.innerHTML=view==='module'?workbench(d):overview(d);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{moduleName=b.dataset.open;view='module';render()});document.querySelectorAll('[data-wb]').forEach(b=>b.onclick=()=>{moduleName=b.dataset.wb;render()});document.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>{document.querySelector('#s'+b.dataset.do).textContent='已处理';notice.textContent=`${rows[b.dataset.do][0]} 已完成“${moduleName}”操作演示。`});if(document.querySelector('#search'))search.onclick=()=>notice.textContent='已按当前条件刷新示例列表。';if(document.querySelector('#create'))create.onclick=()=>notice.textContent='已创建 DEMO-005 示例记录。'}
document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{platform=b.dataset.platform;view='overview';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view==='overview'?'overview':b.dataset.view;render()});render();
</script></body></html>
