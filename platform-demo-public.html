<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>通航与罗盘 · 公开交互演示</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#172033;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe7f0;padding:18px max(24px,calc((100vw - 1100px)/2));font-weight:800;font-size:22px}.wrap{max-width:1100px;margin:auto;padding:28px 24px 80px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 28px}button{font:inherit;cursor:pointer;border:1px solid #d6e2f1;background:#fff;border-radius:12px;padding:12px 18px;color:#465671}button[aria-selected=true],button:hover{background:#2563eb;color:#fff;border-color:#2563eb}.hero,.panel,.card{border:1px solid #dce5f1;border-radius:20px;background:#fff;padding:28px}.hero{background:linear-gradient(120deg,#edf5ff,#fff)}h1{font-size:clamp(30px,5vw,48px);margin:12px 0}h2{font-size:27px;margin:0 0 10px}h3{margin:0 0 8px}p{line-height:1.75;color:#60708a}.tag{color:#2563eb;font-weight:750}.panel{margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.card{padding:20px;background:#fbfdff}.card.active{border-color:#60a5fa;background:#eff6ff}.flow{display:flex;gap:12px;overflow-x:auto;margin-top:18px}.step{min-width:180px;flex:1;background:#eff6ff;border-radius:14px;padding:20px}.number{font-size:13px;color:#2563eb;font-weight:800}.detail{margin-top:18px;padding:20px;border-radius:14px;background:#eff6ff;min-height:120px}.muted{font-size:14px;color:#8290a7}footer{margin-top:24px;color:#8290a7;font-size:13px}@media(max-width:600px){.wrap{padding:20px 16px 50px}.hero,.panel{padding:20px}.flow{flex-direction:column}.step{min-width:0}}
</style></head><body><header>内容服务平台 · 公开演示</header><main class="wrap"><p class="muted">所有名称、任务与数据均为公开展示用示例。</p><nav aria-label="平台切换"><button data-tab="tonghang" aria-selected="true">通航 · 作业台</button><button data-tab="ceyun" aria-selected="false">策云 · 协同平台</button><button data-tab="luopan" aria-selected="false">罗盘 · 项目管理台</button></nav><div id="app"></div><footer>公开交互演示 · 无需账号登录</footer></main>
<script>
const data={tonghang:{name:'通航',type:'作业台',intro:'通航承接业务队列中的标注作业，围绕任务模板、双人标注、质检、验收与申诉，将作业执行和质量收敛放在同一条链路里。',roles:[['标注员','领取、标注、待定、释放并提交任务。'],['质检员','检查标注结果，记录问题并推动修正。'],['验收员','抽查质检结果并确认交付质量。'],['运营人员','配置队列、模板与培训任务。']],groups:[['作业与质量',['标注','双人标注','质检','验收','申诉']],['查询与分析',['标注查询','标注统计','员工统计','工作台']],['培训与管理',['模拟实操','无感标注','队列配置','任务模板']]],flow:[['送审入队','示例业务数据进入队列。'],['派发 / 领取','系统派发或人员领取任务。'],['标注与复核','完成标注，必要时进行双人复核。'],['质检与验收','检查问题、修正并完成验收。'],['结果回传','生成公开示例结果。']]},ceyun:{name:'策云',type:'作业管理协同台',intro:'策云在整体业务链路中呈现作业管理与团队协同视角。此处仅展示平台定位。',roles:[['业务协同','汇总项目需求与作业安排。'],['运营协同','查看进度并协调资源。']],groups:[['协同视角',['需求汇总','作业排期','进度查看']]],flow:[['需求进入','汇总需求。'],['协同安排','确认资源与进度。'],['状态同步','反馈处理状态。']]},luopan:{name:'罗盘',type:'考培与项目管理台',intro:'罗盘用于标注员考培与项目管理，支持培训安排、能力检查和项目运营。',roles:[['学员','参与课程与模拟练习。'],['培训负责人','安排课程、检查完成情况。'],['项目管理者','查看培训与项目进度。'],['运营人员','维护计划与日常记录。']],groups:[['考培管理',['培训计划','课程学习','模拟练习','考核记录']],['项目协同',['项目看板','人员安排','进度跟踪']],['运营支撑',['通知提醒','数据汇总','问题反馈']]],flow:[['建立计划','设定示例培训目标。'],['组织学习','安排课程与练习。'],['考核反馈','记录练习结果。'],['项目分配','按完成情况安排任务。'],['持续跟踪','查看进度与问题。']]}};let active='tonghang';function render(){const d=data[active];document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===active));document.querySelector('#app').innerHTML=`<section class="hero"><span class="tag">${d.name} · ${d.type}</span><h1>${d.name}是什么</h1><p>${d.intro}</p></section><section class="panel"><span class="tag">TEAM</span><h2>谁在用</h2><p>点击角色卡片查看职责。</p><div class="grid">${d.roles.map((r,i)=>`<button class="card" data-role="${i}"><h3>${r[0]}</h3><p>${r[1]}</p></button>`).join('')}</div></section><section class="panel"><span class="tag">CAPABILITIES</span><h2>能力地图</h2><p>点击能力查看演示说明。</p><div class="grid">${d.groups.map(g=>`<div class="card"><h3>${g[0]}</h3>${g[1].map(c=>`<button data-cap="${c}">${c}</button>`).join(' ')}</div>`).join('')}</div><div class="detail" id="detail">选择上方能力，查看其在示例作业链路中的作用。</div></section><section class="panel"><span class="tag">FLOW</span><h2>主作业链路</h2><p>从任务进入到结果反馈的公开示例流程。</p><div class="flow">${d.flow.map((s,i)=>`<div class="step"><span class="number">${String(i+1).padStart(2,'0')}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></section>`;document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>document.querySelector('#detail').textContent=`${b.dataset.cap}：该模块用于支持${d.name}的作业执行、协同或质量管理。`);document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});render();
</script></body></html>
